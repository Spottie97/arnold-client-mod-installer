name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Rust lint, test, build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: clippy (local-source)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features local-source -- -D warnings
      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml --bins --lib --tests
      - name: test (local-source)
        run: cargo test --manifest-path src-tauri/Cargo.toml --bins --lib --tests --features local-source
      - name: release-manifest (test key)
        run: |
          chmod +x tools/release-manifest
          tools/release-manifest --test-key --out /tmp/arnold-manifest
          test -s /tmp/arnold-manifest/manifest.json
          test -s /tmp/arnold-manifest/manifest.json.sig
          test -s /tmp/arnold-manifest/SHA512SUMS.txt
          grep -q 'arnold-snowfall-1.3.3.jar' /tmp/arnold-manifest/SHA512SUMS.txt
      - name: build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: build (local-source, not a release)
        run: cargo build --manifest-path src-tauri/Cargo.toml --features local-source
