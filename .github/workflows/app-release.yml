name: App release

on:
  push:
    tags:
      - "app-v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi
          # dmg alone is not an updater target; app produces .app.tar.gz + .sig.
          - platform: macos-latest
            bundles: app,dmg
          - platform: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a public release that trusts the test manifest key
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            awk -v name="$1" '
              $0 ~ ("const " name ": &str =") { found = 1; next }
              found { gsub(/[^0-9a-fA-F]/, "", $0); print; exit }
            ' src-tauri/src/manifest.rs
          }
          production="$(extract PRODUCTION_MANIFEST_PUBLIC_KEY_HEX)"
          test_key="$(extract TEST_MANIFEST_PUBLIC_KEY_HEX)"
          override="$(printf '%s' "${ARNOLD_MANIFEST_PUBKEY:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -n "$override" ]; then
            key="$override"
          else
            key="$(printf '%s' "$production" | tr '[:upper:]' '[:lower:]')"
          fi
          placeholder="$(printf '%.0s0' {1..64})"
          if [ "${#key}" -ne 64 ] || [ "$key" = "$test_key" ] || [ "$key" = "$placeholder" ]; then
            echo "Public release build is not configured with a production manifest public key."
            exit 1
          fi
          echo "manifest public key accepted for this public release build"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev
      - run: npm ci
      - name: Test before packaging
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          npm test
      - name: Inject updater public key into the release config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          # The public key is not secret, but do not print it and do not enable xtrace.
          node tools/inject-updater-pubkey.cjs src-tauri/tauri.updater.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          # Never pass --features local-source. That flag is test-only.
          args: --bundles ${{ matrix.bundles }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--features updater --config src-tauri/tauri.updater.conf.json' || '' }}
      - name: Build slim AppImage (system WebKit, Discord-sized)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x tools/make-slim-appimage.sh
          tools/make-slim-appimage.sh \
            src-tauri/target/release/arnold-client-mods \
            "src-tauri/target/release/bundle/appimage/Arnold-Client-Mods-slim.AppImage"
      - name: Attach slim AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/appimage/Arnold-Client-Mods-slim.AppImage
      - name: Enforce 10 MB size gate
        shell: bash
        run: |
          set -euo pipefail
          max=10485760
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(find src-tauri/target -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*-slim.AppImage' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No msi/dmg/slim AppImage artifacts found"
            find src-tauri/target -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) | head
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            echo "$f $size bytes"
            if [ "$size" -gt "$max" ]; then
              echo "FAIL: $f is over 10 MB"
              failed=1
            fi
          done
          exit "$failed"

  updater-feed:
    name: Stage latest.json on the app-updater draft
    needs: release
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Copy the updater feed onto the rolling app-updater tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_TAG" =~ ^app-v ]]; then
            echo "expected an app-v* tag, got $VERSION_TAG"
            exit 1
          fi
          mkdir -p dist/updater-feed
          gh release download "$VERSION_TAG" --dir dist/updater-feed --pattern 'latest.json' --clobber
          # Platform .sig files live next to the installers; copy any that are present.
          gh release download "$VERSION_TAG" --dir dist/updater-feed --pattern '*.sig' --clobber || true
          test -s dist/updater-feed/latest.json
          if ! gh release view app-updater >/dev/null 2>&1; then
            gh release create app-updater               --draft               --prerelease               --title "App updater feed"               --notes "Rolling feed for the installer self-update. The app reads /releases/download/app-updater/latest.json so the feed is not tied to /releases/latest (that URL serves the mods manifest). Keep this release a prerelease when publishing so it never becomes Latest. Publish this draft only after the matching app-v* draft is published, otherwise latest.json would point at unpublished installers."
          fi
          # Do not publish this draft here.
          gh release upload app-updater dist/updater-feed/latest.json --clobber
          shopt -s nullglob
          sigs=(dist/updater-feed/*.sig)
          if [ ${#sigs[@]} -gt 0 ]; then
            gh release upload app-updater "${sigs[@]}" --clobber
          fi
          draft="$(gh release view app-updater --json isDraft,isPrerelease --jq '{isDraft,isPrerelease}')"
          echo "Updated draft/prerelease app-updater: $draft"
          echo "A human still has to publish the app-v* draft, then publish this app-updater feed as a prerelease."
