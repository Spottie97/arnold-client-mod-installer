name: App release

on:
  push:
    tags:
      - "app-v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi
          - platform: macos-latest
            bundles: dmg
          - platform: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev
      - run: npm ci
      - name: Test before packaging
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}
      - name: Build slim AppImage (system WebKit, Discord-sized)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x tools/make-slim-appimage.sh
          tools/make-slim-appimage.sh \
            src-tauri/target/release/arnold-client-mods \
            "src-tauri/target/release/bundle/appimage/Arnold-Client-Mods-slim.AppImage"
      - name: Attach slim AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/release/bundle/appimage/Arnold-Client-Mods-slim.AppImage
      - name: Enforce 10 MB size gate
        shell: bash
        run: |
          set -euo pipefail
          max=10485760
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(find src-tauri/target -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*-slim.AppImage' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No msi/dmg/slim AppImage artifacts found"
            find src-tauri/target -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) | head
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            echo "$f $size bytes"
            if [ "$size" -gt "$max" ]; then
              echo "FAIL: $f is over 10 MB"
              failed=1
            fi
          done
          exit "$failed"
